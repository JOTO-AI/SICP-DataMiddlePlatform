server {
    listen 8080;
    server_name _;
    # Preserve the browser's public host, port and scheme behind Docker/proxies.
    absolute_redirect off;
    root /usr/share/nginx/html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Cache-Control no-store always;
    client_max_body_size 64k;
    location = / { return 302 /console/; }
    location = /console { return 301 /console/; }
    location /console/ { try_files $uri $uri/ /console/index.html; }
    location / { return 404; }
}
