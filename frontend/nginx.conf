server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Cache-Control no-store always;
    client_max_body_size 64k;
    proxy_read_timeout 35s;
    proxy_connect_timeout 5s;
    # Resolve Docker service names again after containers restart.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location = / { return 302 /console/; }
    location = /console { return 301 /console/; }
    location /console/ { try_files $uri $uri/ /console/index.html; }
    location ~ ^/gateway/query(/(?:api/v1/sicp/.*|livez|readyz))$ {
        set $query_path $1;
        proxy_pass http://query:8080$query_path$is_args$args;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
    }
    location ~ ^/gateway/worker(/(?:admin/v1/tasks/.*|livez|readyz))$ {
        set $worker_path $1;
        proxy_pass http://worker:8081$worker_path$is_args$args;
        proxy_set_header X-API-Key "";
        proxy_set_header Cookie "";
    }
    location / { return 404; }
}
