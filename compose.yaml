# Production by default. The development profile alone enables synthetic source/mail services.
name: ${SICP_PROJECT:-sicp-production}

x-database-environment: &database-environment
  DATABASE_M0_URL: "${DATABASE_M0_URL:?Set DATABASE_M0_URL in .env (copy .env.example)}"
  DATABASE_M1_URL: "${DATABASE_M1_URL:?Set DATABASE_M1_URL in .env (copy .env.example)}"
  DATABASE_S0_URL: "${DATABASE_S0_URL:?Set DATABASE_S0_URL in .env (copy .env.example)}"
  DATABASE_S1_URL: "${DATABASE_S1_URL:?Set DATABASE_S1_URL in .env (copy .env.example)}"
  DATABASE_CONTROL_URL: "${DATABASE_CONTROL_URL:?Set DATABASE_CONTROL_URL in .env (copy .env.example)}"
  DATABASE_LOG_URL: "${DATABASE_LOG_URL:?Set DATABASE_LOG_URL in .env (copy .env.example)}"

x-runtime-environment: &runtime-environment
  <<: *database-environment
  SOURCE_TIMEZONE: "${SOURCE_TIMEZONE:?Set SOURCE_TIMEZONE in .env (copy .env.example)}"
  STARTUP_TIMEOUT: "${STARTUP_TIMEOUT:?Set STARTUP_TIMEOUT in .env (copy .env.example)}"
  SHUTDOWN_TIMEOUT: "${SHUTDOWN_TIMEOUT:?Set SHUTDOWN_TIMEOUT in .env (copy .env.example)}"
  DEPENDENCY_TIMEOUT: "${DEPENDENCY_TIMEOUT:?Set DEPENDENCY_TIMEOUT in .env (copy .env.example)}"
  QUERY_API_KEY: "${QUERY_API_KEY:?Set QUERY_API_KEY in .env (copy .env.example)}"
  REDIS_URL: "${REDIS_URL:?Set REDIS_URL in .env (copy .env.example)}"
  LOG_DIRECTORY: "/var/lib/sicp/logs"
  LOG_MAX_BYTES: "${LOG_MAX_BYTES:?Set LOG_MAX_BYTES in .env (copy .env.example)}"
  LOG_MAX_FILES: "${LOG_MAX_FILES:?Set LOG_MAX_FILES in .env (copy .env.example)}"
  SNAPSHOT_KEY: "${SNAPSHOT_KEY:?Set SNAPSHOT_KEY in .env (copy .env.example)}"
  AUDIT_KEY: "${AUDIT_KEY:?Set AUDIT_KEY in .env (copy .env.example)}"
  ENVIRONMENT: "${ENVIRONMENT:?Set ENVIRONMENT in .env (copy .env.example)}"

x-service: &service
  platform: linux/amd64
  restart: unless-stopped
  read_only: true
  user: "65532:65532"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 35s
  tmpfs: ["/tmp:size=16m,mode=1777"]
  networks: [sicp]

x-postgres: &postgres
  # Major upgrades require data migration; see deploy/README.md.
  image: postgres:18.6-trixie
  platform: linux/amd64
  restart: unless-stopped
  environment: &postgres-environment
    POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in .env (copy .env.example)}"
    POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}"
    QUERY_PASSWORD: "${QUERY_PASSWORD:?Set QUERY_PASSWORD in .env (copy .env.example)}"
    WORKER_PASSWORD: "${WORKER_PASSWORD:?Set WORKER_PASSWORD in .env (copy .env.example)}"
    LOGGER_PASSWORD: "${LOGGER_PASSWORD:?Set LOGGER_PASSWORD in .env (copy .env.example)}"
  healthcheck:
    # The temporary init server only listens on a Unix socket. Wait for TCP
    # so migrations cannot race the first-run database/role initialization.
    test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d postgres"]
    interval: 2s
    timeout: 2s
    retries: 40
  networks: [sicp]
  shm_size: 128mb
  stop_grace_period: 35s

services:
  db-m:
    <<: *postgres
    command: [postgres, -c, "max_connections=${POSTGRES_M_MAX_CONNECTIONS-256}"]
    environment:
      <<: *postgres-environment
      SICP_CLUSTER: M
    volumes:
      - "${SICP_DATA_ROOT:?Set SICP_DATA_ROOT in .env}/${COMPOSE_PROJECT_NAME}/pg-m:/var/lib/postgresql"
      - ./deploy/init-postgres.sh:/docker-entrypoint-initdb.d/10-sicp.sh:ro
  db-s:
    <<: *postgres
    command: [postgres, -c, "max_connections=${POSTGRES_S_MAX_CONNECTIONS-128}"]
    environment:
      <<: *postgres-environment
      SICP_CLUSTER: S
    volumes:
      - "${SICP_DATA_ROOT:?Set SICP_DATA_ROOT in .env}/${COMPOSE_PROJECT_NAME}/pg-s:/var/lib/postgresql"
      - ./deploy/init-postgres.sh:/docker-entrypoint-initdb.d/10-sicp.sh:ro
  db-log:
    <<: *postgres
    command: [postgres, -c, "max_connections=${POSTGRES_LOG_MAX_CONNECTIONS-100}"]
    environment:
      <<: *postgres-environment
      SICP_CLUSTER: log
    volumes:
      - "${SICP_DATA_ROOT:?Set SICP_DATA_ROOT in .env}/${COMPOSE_PROJECT_NAME}/pg-log:/var/lib/postgresql"
      - ./deploy/init-postgres.sh:/docker-entrypoint-initdb.d/10-sicp.sh:ro
  redis:
    image: redis:7.4-bookworm
    platform: linux/amd64
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --appendfsync, always]
    volumes: ["${SICP_DATA_ROOT:?Set SICP_DATA_ROOT in .env}/${COMPOSE_PROJECT_NAME}/redis:/data"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 40
    networks: [sicp]
  volumes:
    image: busybox:1.37
    platform: linux/amd64
    restart: "no"
    network_mode: none
    volumes: ["${SICP_DATA_ROOT:?Set SICP_DATA_ROOT in .env}/${COMPOSE_PROJECT_NAME}/query-logs:/query-logs", "${SICP_DATA_ROOT:?Set SICP_DATA_ROOT in .env}/${COMPOSE_PROJECT_NAME}/query-replicas:/query-replicas", "${SICP_DATA_ROOT:?Set SICP_DATA_ROOT in .env}/${COMPOSE_PROJECT_NAME}/worker-logs:/worker-logs", "${SICP_DATA_ROOT:?Set SICP_DATA_ROOT in .env}/${COMPOSE_PROJECT_NAME}/staging:/staging", "${SICP_DATA_ROOT:?Set SICP_DATA_ROOT in .env}/${COMPOSE_PROJECT_NAME}/targets:/targets", "${SICP_DATA_ROOT:?Set SICP_DATA_ROOT in .env}/${COMPOSE_PROJECT_NAME}/spool:/spool"]
    command: [sh, -c, "chown 65532:65532 /query-logs /query-replicas /worker-logs /staging /targets /spool && chmod 700 /query-logs /query-replicas /worker-logs /staging /targets /spool"]
  mock-volumes:
    image: busybox:1.37
    platform: linux/amd64
    profiles: [development]
    restart: "no"
    network_mode: none
    volumes: ["mock-mail:/mock-mail"]
    command: [sh, -c, "chown 65532:65532 /mock-mail && chmod 700 /mock-mail"]
  mock:
    <<: *service
    profiles: [development]
    depends_on:
      mock-volumes: {condition: service_completed_successfully}
    build: {context: ./deploy, dockerfile: Mock.Dockerfile}
    image: sicp-mock:phase1
    volumes:
      - ./mock_data:/app/mock_data:ro
      - mock-mail:/mail
    environment:
      MOCK_TOKEN: synthetic-source-token
      MOCK_CONTROL_TOKEN: synthetic-mock-control-token
      PYTHONDONTWRITEBYTECODE: "1"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/livez', timeout=3).read()"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      sicp:
        aliases: [mock-source, mock-mail]
  query:
    <<: *service
    deploy:
      replicas: ${QUERY_REPLICAS-1}
    entrypoint: [/bin/sh, /usr/local/bin/query-entrypoint.sh]
    depends_on:
      volumes: {condition: service_completed_successfully}
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    networks: [sicp, ingress]
    build: {context: ., dockerfile: deploy/Dockerfile, args: {SERVICE: query-service}}
    image: sicp-query:phase1
    environment:
      <<: *runtime-environment
      HTTP_ADDRESS: 0.0.0.0:8080
      QUERY_MAX_EXECUTIONS: "${QUERY_MAX_EXECUTIONS-8}"
      QUERY_MAX_QUEUE: "${QUERY_MAX_QUEUE-64}"
      QUERY_EXECUTION_TIMEOUT: "${QUERY_EXECUTION_TIMEOUT-30s}"
      QUERY_DB_BUSINESS_MAX_CONNS: "${QUERY_DB_BUSINESS_MAX_CONNS-16}"
      QUERY_DB_CONTROL_MAX_CONNS: "${QUERY_DB_CONTROL_MAX_CONNS-16}"
      QUERY_DB_LOG_MAX_CONNS: "${QUERY_DB_LOG_MAX_CONNS-16}"
      DATABASE_USER: "sicp_query"
      DATABASE_PASSWORD: "${QUERY_PASSWORD:?Set QUERY_PASSWORD in .env (copy .env.example)}"
      DATABASE_LOG_USER: "sicp_logger"
      DATABASE_LOG_PASSWORD: "${LOGGER_PASSWORD:?Set LOGGER_PASSWORD in .env (copy .env.example)}"
    volumes: ["${SICP_DATA_ROOT:?Set SICP_DATA_ROOT in .env}/${COMPOSE_PROJECT_NAME}/query-logs:/var/lib/sicp/logs", "${SICP_DATA_ROOT:?Set SICP_DATA_ROOT in .env}/${COMPOSE_PROJECT_NAME}/query-replicas:/var/lib/sicp/query-replicas"]
    healthcheck:
      test: [CMD, /usr/local/bin/service, --healthcheck]
      interval: 5s
      timeout: 6s
      retries: 10
  query-gateway:
    <<: *service
    build: {context: ./deploy, dockerfile: QueryGateway.Dockerfile}
    image: sicp-query-gateway:phase1
    depends_on:
      query: {condition: service_healthy}
    networks: [ingress]
    environment:
      QUERY_REPLICAS: "${QUERY_REPLICAS-1}"
    ports: ["0.0.0.0:${SICP_QUERY_PORT:-18080}:8080"]
    healthcheck:
      test: [CMD, wget, -q, --spider, "http://127.0.0.1:8080/livez"]
      interval: 5s
      timeout: 6s
      retries: 10
  worker:
    <<: *service
    depends_on:
      volumes: {condition: service_completed_successfully}
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      mock: {condition: service_healthy, required: false}
    networks: [sicp, ingress]
    build: {context: ., dockerfile: deploy/Dockerfile, args: {SERVICE: sync-worker}}
    image: sicp-worker:phase1
    entrypoint: [/bin/sh, /usr/local/bin/worker-entrypoint.sh]
    environment:
      <<: *runtime-environment
      HTTP_ADDRESS: 0.0.0.0:8081
      DATABASE_USER: "sicp_worker"
      DATABASE_PASSWORD: "${WORKER_PASSWORD:?Set WORKER_PASSWORD in .env (copy .env.example)}"
      DATABASE_LOG_USER: "sicp_logger"
      DATABASE_LOG_PASSWORD: "${LOGGER_PASSWORD:?Set LOGGER_PASSWORD in .env (copy .env.example)}"
      STAGING_DIRECTORY: "/var/lib/sicp/staging"
      TARGET_DIRECTORY: "/var/lib/sicp/targets"
      SPOOL_DIRECTORY: "/var/lib/sicp/spool"
      STAGING_MAX_BYTES: "${STAGING_MAX_BYTES:-0}"
      TARGET_MAX_BYTES: "${TARGET_MAX_BYTES:-0}"
      SPOOL_MAX_BYTES: "${SPOOL_MAX_BYTES:-0}"
      SOURCE_ORIGIN: "${SOURCE_ORIGIN:-}"
      SOURCE_APP_ID: "${SOURCE_APP_ID:-}"
      SOURCE_APP_SECRET: "${SOURCE_APP_SECRET:-}"
      SOURCE_SCOPE: "${SOURCE_SCOPE:-}"
      SOURCE_PAGE_SIZE: "${SOURCE_PAGE_SIZE:-1000}"
      SOURCE_PAGE_CONCURRENCY: "${SOURCE_PAGE_CONCURRENCY:-4}"
      BUILD_TABLE_CONCURRENCY: "${BUILD_TABLE_CONCURRENCY:-2}"
      BUILD_CHECK_TIMEOUT: "${BUILD_CHECK_TIMEOUT:-30m}"
      BUILD_IMPORT_MODE: "${BUILD_IMPORT_MODE:-copy}"
      SOURCE_QUALITY: "${SOURCE_QUALITY:-}"
      MAIL_ADDRESS: "${MAIL_ADDRESS:-}"
      MAIL_TLS: "${MAIL_TLS:-}"
      MAIL_FROM: "${MAIL_FROM:-}"
      MAIL_TO: "${MAIL_TO:-}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:?Set ADMIN_USERNAME in .env (copy .env.example)}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env (copy .env.example)}"
      CONSOLE_QUERY_URL: "http://query-gateway:8080"
      CONSOLE_COOKIE_SECURE: "${CONSOLE_COOKIE_SECURE:-false}"
    volumes: ["${SICP_DATA_ROOT:?Set SICP_DATA_ROOT in .env}/${COMPOSE_PROJECT_NAME}/worker-logs:/var/lib/sicp/logs", "${SICP_DATA_ROOT:?Set SICP_DATA_ROOT in .env}/${COMPOSE_PROJECT_NAME}/staging:/var/lib/sicp/staging", "${SICP_DATA_ROOT:?Set SICP_DATA_ROOT in .env}/${COMPOSE_PROJECT_NAME}/targets:/var/lib/sicp/targets", "${SICP_DATA_ROOT:?Set SICP_DATA_ROOT in .env}/${COMPOSE_PROJECT_NAME}/spool:/var/lib/sicp/spool"]
    ports: ["127.0.0.1:${SICP_WORKER_PORT:-18081}:8081"]
    healthcheck:
      test: [CMD, /usr/local/bin/service, --healthcheck]
      interval: 5s
      timeout: 6s
      retries: 10
  migrate:
    <<: *service
    build: {context: ., dockerfile: deploy/Dockerfile, args: {SERVICE: sync-worker}}
    image: sicp-migrate:phase1
    restart: "no"
    depends_on:
      db-m: {condition: service_healthy}
      db-s: {condition: service_healthy}
      db-log: {condition: service_healthy}
    entrypoint: [/usr/local/bin/db-migrate]
    environment:
      <<: *database-environment
      DATABASE_USER: "${POSTGRES_USER:?Set POSTGRES_USER in .env (copy .env.example)}"
      DATABASE_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}"
      DATABASE_LOG_USER: "${POSTGRES_USER:?Set POSTGRES_USER in .env (copy .env.example)}"
      DATABASE_LOG_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}"
  console:
    build: {context: ./frontend}
    image: sicp-console:phase1
    depends_on:
      query-gateway: {condition: service_healthy}
      worker: {condition: service_healthy}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=32m,mode=1777"]
    ports: ["0.0.0.0:${SICP_CONSOLE_PORT:-18082}:8080"]
    networks: [ingress]
    healthcheck:
      test: [CMD, wget, -q, --spider, "http://127.0.0.1:8080/console/"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  # Only HTTP services join the ordinary bridge needed for loopback publishing.
  # PostgreSQL, Redis and Mock remain exclusively on the internal network.
  ingress:
  sicp:
    internal: true

volumes:
  mock-mail:
