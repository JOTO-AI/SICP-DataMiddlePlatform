# Opt-in after the legacy drain procedure. Run migrations explicitly before
# starting services; a later log outage must not become a startup dependency.
x-upstream-runtime: &upstream-runtime
  LOG_STORAGE_MODE: dual
  DATABASE_UPSTREAM_LOG_URL: "${DATABASE_UPSTREAM_LOG_URL:?Set independent upstream log URL}"
  DATABASE_UPSTREAM_LOG_USER: sicp_upstream_logger
  DATABASE_UPSTREAM_LOG_PASSWORD: "${UPSTREAM_LOGGER_PASSWORD:?Set independent upstream log password}"
  UPSTREAM_LOG_DIRECTORY: /var/lib/sicp/upstream-logs
  UPSTREAM_LOG_MAX_BYTES: "${UPSTREAM_LOG_MAX_BYTES:-67108864}"
  UPSTREAM_LOG_MAX_FILES: "${UPSTREAM_LOG_MAX_FILES:-10000}"

services:
  db-upstream-log:
    image: postgres:18.6-trixie
    platform: linux/amd64
    restart: unless-stopped
    command: [postgres, -c, "max_connections=${POSTGRES_UPSTREAM_LOG_MAX_CONNECTIONS:-100}"]
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      UPSTREAM_LOGGER_PASSWORD: "${UPSTREAM_LOGGER_PASSWORD:?Set independent upstream log password}"
      SICP_CLUSTER: upstream-log
    volumes:
      - "${SICP_DATA_ROOT:?}/${COMPOSE_PROJECT_NAME}/pg-upstream-log:/var/lib/postgresql"
      - ./deploy/init-postgres.sh:/docker-entrypoint-initdb.d/10-sicp.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 40
    networks: [sicp]
    shm_size: 128mb
    stop_grace_period: 35s
  volumes:
    volumes:
      - "${SICP_DATA_ROOT:?}/${COMPOSE_PROJECT_NAME}/query-upstream-logs:/query-upstream-logs"
      - "${SICP_DATA_ROOT:?}/${COMPOSE_PROJECT_NAME}/worker-upstream-logs:/worker-upstream-logs"
    command: [sh, -c, "chown 65532:65532 /query-logs /query-replicas /worker-logs /staging /targets /spool /query-upstream-logs /worker-upstream-logs && chmod 700 /query-logs /query-replicas /worker-logs /staging /targets /spool /query-upstream-logs /worker-upstream-logs"]
  query:
    environment:
      <<: *upstream-runtime
    volumes:
      - "${SICP_DATA_ROOT:?}/${COMPOSE_PROJECT_NAME}/query-upstream-logs:/var/lib/sicp/upstream-logs"
  worker:
    environment:
      <<: *upstream-runtime
    volumes:
      - "${SICP_DATA_ROOT:?}/${COMPOSE_PROJECT_NAME}/worker-upstream-logs:/var/lib/sicp/upstream-logs"
  migrate:
    depends_on:
      db-upstream-log: {condition: service_healthy}
    environment:
      LOG_STORAGE_MODE: dual
      DATABASE_UPSTREAM_LOG_URL: "${DATABASE_UPSTREAM_LOG_URL:?Set independent upstream log URL}"
      DATABASE_UPSTREAM_LOG_USER: "${POSTGRES_USER:?Set POSTGRES_USER}"
      DATABASE_UPSTREAM_LOG_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
