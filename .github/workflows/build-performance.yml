name: B01 build baseline
on:
  push:
    branches: [perf/build-to-ready-30min]
  workflow_dispatch:
    inputs:
      profile:
        description: Capture CPU and heap profiles (diagnostic timing only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: b01-${{ github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GOTOOLCHAIN: local
      SICP_INTEGRATION: '1'
      SICP_BUILD_PERFORMANCE: '1'
      SICP_BUILD_PROFILE: ${{ inputs.profile && '1' || '0' }}
      SICP_PROJECT: sicp-build-baseline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Prepare isolated synthetic dependencies
        shell: bash
        run: |
          python3 scripts/check-compose-config.py --write-development-env .env
          docker compose -p "$SICP_PROJECT" build mock
          bash scripts/sicp.sh infra
          for entry in M:db-m S:db-s LOG:db-log REDIS:redis; do
            key=${entry%%:*}
            service=${entry#*:}
            container=$(docker compose -p "$SICP_PROJECT" ps -q "$service")
            address=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$container")
            printf 'SICP_TEST_%s_HOST=%s\n' "$key" "$address" >> "$GITHUB_ENV"
          done
      - name: Freeze runner specification and run real worker capacity baseline
        shell: bash
        run: bash scripts/check-build-performance.sh
      - name: Collect logs and remove isolated volumes
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/build-performance
          docker compose -p "$SICP_PROJECT" logs --no-color > artifacts/build-performance/compose.log 2>&1 || true
          docker compose -p "$SICP_PROJECT" down --volumes --remove-orphans
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b01-baseline-${{ github.sha }}
          path: |
            artifacts/build-performance/
            !artifacts/build-performance/integration.test
          if-no-files-found: error
