name: Linux CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Unit tests, race checks, vet and Linux builds
        run: ./scripts/check.sh
      - name: Repeat lifecycle race regression
        run: go test -race -count=30 ./internal/service
      - name: Build service images
        run: |
          docker build --platform linux/amd64 -f deploy/Dockerfile --build-arg SERVICE=query-service -t sicp-query:p01 .
          docker build --platform linux/amd64 -f deploy/Dockerfile --build-arg SERVICE=sync-worker -t sicp-worker:p01 .
      - name: Validate deployment template without starting integration services
        run: |
          bash scripts/sicp.sh prepare
          docker compose -f deploy/compose.yaml config --quiet
          docker build --platform linux/amd64 -f deploy/Mock.Dockerfile -t sicp-mock:p15 deploy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-unit-evidence
          path: artifacts/
          if-no-files-found: error
  integration:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
      SICP_INTEGRATION: '1'
      SICP_PROJECT: sicp-integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Prepare isolated synthetic dependencies
        run: |
          bash scripts/sicp.sh prepare
          docker compose -p "$SICP_PROJECT" -f deploy/compose.yaml build mock
          bash scripts/sicp.sh infra
      - name: Run integration cases sequentially
        run: |
          mkdir -p artifacts/integration
          set +e
          go test -tags=integration -race -count=1 -parallel=1 -timeout=20m -json ./tests/integration | tee artifacts/integration/results.jsonl
          result=${PIPESTATUS[0]}
          printf '%s\n' "$result" > artifacts/integration/exit-code.txt
          exit "$result"
      - name: Collect dependency logs and remove isolated volumes
        if: always()
        run: |
          mkdir -p artifacts/integration
          docker compose -p "$SICP_PROJECT" -f deploy/compose.yaml logs --no-color > artifacts/integration/compose.log 2>&1 || true
          docker compose -p "$SICP_PROJECT" -f deploy/compose.yaml down --volumes --remove-orphans
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-integration-evidence
          path: artifacts/integration/
          if-no-files-found: error
