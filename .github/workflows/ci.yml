name: Linux CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      SICP_PROJECT: sicp-compose-smoke
    steps:
      - uses: actions/checkout@v4
      - name: Deploy from clean checkout, initialize and recreate with retained data
        run: bash scripts/check-compose.sh
      - name: Collect logs and remove isolated test volumes
        if: always()
        run: |
          mkdir -p artifacts/compose
          docker compose ps -a > artifacts/compose/status.txt 2>&1 || true
          docker compose logs --no-color > artifacts/compose/compose.log 2>&1 || true
          docker compose down --volumes --remove-orphans
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-evidence
          path: artifacts/compose/
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Build console image
        run: docker build -t sicp-console:phase1 .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-evidence
          path: |
            frontend/test-results/
            frontend/dist/
  unit:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Unit tests, race checks, vet and Linux builds
        run: ./scripts/check.sh
      - name: Repeat lifecycle race regression
        run: go test -race -count=30 ./internal/service
      - name: Build service images
        run: |
          docker build --platform linux/amd64 -f deploy/Dockerfile --build-arg SERVICE=query-service -t sicp-query:p01 .
          docker build --platform linux/amd64 -f deploy/Dockerfile --build-arg SERVICE=sync-worker -t sicp-worker:p01 .
      - name: Validate deployment template without starting integration services
        run: |
          bash scripts/sicp.sh prepare
          python3 scripts/check-compose-config.py
          docker build --platform linux/amd64 -f deploy/Mock.Dockerfile -t sicp-mock:p15 deploy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-unit-evidence
          path: artifacts/
          if-no-files-found: error
  integration:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
      SICP_INTEGRATION: '1'
      SICP_PROJECT: sicp-integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Prepare isolated synthetic dependencies
        run: |
          python3 scripts/check-compose-config.py --write-development-env .env
          docker compose -p "$SICP_PROJECT" build mock
          bash scripts/sicp.sh infra
          # Internal-only bridges do not publish host ports. The Linux host
          # can address this job's containers directly through their bridge.
          for entry in M:db-m S:db-s LOG:db-log REDIS:redis; do
            key=${entry%%:*}
            service=${entry#*:}
            container=$(docker compose -p "$SICP_PROJECT" ps -q "$service")
            address=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$container")
            printf 'SICP_TEST_%s_HOST=%s\n' "$key" "$address" >> "$GITHUB_ENV"
          done
      - name: Run integration cases sequentially
        run: |
          mkdir -p artifacts/integration
          set +e
          for group in I01 I02 I03 I04 I05; do
            go test -tags=integration -race -count=1 -parallel=1 -timeout=15m -run "^Test${group}_" -json ./tests/integration | tee "artifacts/integration/$group.jsonl"
            result=${PIPESTATUS[0]}
            printf '%s\n' "$result" > "artifacts/integration/$group-exit-code.txt"
            if ((result != 0)); then exit "$result"; fi
          done
      - name: Collect dependency logs and remove isolated volumes
        if: always()
        run: |
          mkdir -p artifacts/integration
          docker compose -p "$SICP_PROJECT" logs --no-color > artifacts/integration/compose.log 2>&1 || true
          docker compose -p "$SICP_PROJECT" down --volumes --remove-orphans
      - name: Build deployment images from clean checkout
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          bash scripts/sicp.sh build
      - name: Run deployment integration cases sequentially
        run: |
          set +e
          go test -tags=integration -race -count=1 -parallel=1 -timeout=15m -run '^TestI06_' -json ./tests/integration | tee artifacts/integration/I06.jsonl
          result=${PIPESTATUS[0]}
          printf '%s\n' "$result" > artifacts/integration/I06-exit-code.txt
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-integration-evidence
          path: |
            artifacts/integration/
            artifacts/build-performance/
          if-no-files-found: error
