# Nginx >= 1.27.3 supports DNS updates for open-source upstream groups.
log_format query_backend 'query_backend=$upstream_addr status=$status';
upstream query_instances {
    zone query_instances 64k;
    resolver 127.0.0.11 valid=2s ipv6=off;
    resolver_timeout 2s;
    least_conn;
    server query:8080 resolve max_fails=1 fail_timeout=3s;
    keepalive 32;
}
server {
    listen 8080;
    server_name _;
    server_tokens off;
    # Do not log API keys, query bodies or snapshot tokens at the gateway.
    access_log /dev/stdout query_backend;
    client_max_body_size 1m;
    location / {
        proxy_pass http://query_instances;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
        # Never replay a POST that has already been sent to a backend.
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
    }
}
