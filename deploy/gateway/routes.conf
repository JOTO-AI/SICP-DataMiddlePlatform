client_max_body_size 1m;
location = / {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    return 302 /console/;
}
location = /console {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    return 301 /console/;
}
location ^~ /console/ {
    include /etc/nginx/sicp/headers.conf;
    set $console_host console:8080;
    proxy_pass http://$console_host;
}
location ^~ /console-api/ { include /etc/nginx/sicp/management.conf; }
location = /console-api { return 404; }
location = /admin/v1/tasks { return 404; }
location = /admin/v1/tables { return 404; }
location = /api/v1/sicp { return 404; }
location ^~ /admin/v1/tasks/ { include /etc/nginx/sicp/management.conf; }
location ^~ /admin/v1/tables/ { include /etc/nginx/sicp/management.conf; }
location = /admin/v1/update-events { include /etc/nginx/sicp/management.conf; }
location ^~ /admin/v1/update-events/ { include /etc/nginx/sicp/management.conf; }
location = /admin/v1/sources { include /etc/nginx/sicp/management.conf; }
location = /admin/v1/overview { include /etc/nginx/sicp/management.conf; }
location ^~ /admin/v1/settings/ { include /etc/nginx/sicp/management.conf; }
location = /admin/v1/system/status { include /etc/nginx/sicp/management.conf; }
location ^~ /admin/v1/maintenance/cleanup { include /etc/nginx/sicp/management.conf; }
location = /admin/v1/notifications { include /etc/nginx/sicp/management.conf; }
location ^~ /admin/v1/notifications/ { include /etc/nginx/sicp/management.conf; }
location = /admin/v1/apis { include /etc/nginx/sicp/management.conf; }
location ^~ /admin/v1/apis/ { include /etc/nginx/sicp/management.conf; }
location = /admin/v1/api-tests { include /etc/nginx/sicp/management.conf; }
location ^~ /admin/v1/api-tests/ { include /etc/nginx/sicp/management.conf; }
location ^~ /admin/v1/logs/ {
    proxy_buffering off;
    proxy_cache off;
    include /etc/nginx/sicp/management.conf;
}
location ^~ /api/v1/sicp/ {
    include /etc/nginx/sicp/headers.conf;
    proxy_pass http://query_instances;
}
location / { return 404; }
