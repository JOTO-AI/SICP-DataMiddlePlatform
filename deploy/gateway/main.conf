pid /tmp/sicp-nginx/nginx.pid;
error_log /dev/stderr crit;
worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_body_temp_path /tmp/sicp-nginx/client;
    proxy_temp_path /tmp/sicp-nginx/proxy;
    fastcgi_temp_path /tmp/sicp-nginx/fastcgi;
    uwsgi_temp_path /tmp/sicp-nginx/uwsgi;
    scgi_temp_path /tmp/sicp-nginx/scgi;
    log_format query_backend 'query_backend=$upstream_addr status=$status';
    access_log /dev/stdout query_backend;
    resolver 127.0.0.11 valid=2s ipv6=off;
    resolver_timeout 2s;
    proxy_http_version 1.1;
    proxy_connect_timeout 2s;
    proxy_read_timeout 35s;
    proxy_send_timeout 35s;
    client_body_timeout 35s;
    send_timeout 35s;
    proxy_max_temp_file_size 0;
    proxy_buffer_size 8k;
    proxy_buffers 4 8k;
    proxy_busy_buffers_size 16k;
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;
    upstream query_instances {
        zone query_instances 64k;
        resolver 127.0.0.11 valid=2s ipv6=off;
        resolver_timeout 2s;
        least_conn;
        server query:8080 resolve max_fails=1 fail_timeout=3s;
        keepalive 32;
    }
    server {
        listen 8080;
        server_name _;
        client_max_body_size 1m;
        location ^~ /api/v1/sicp/ {
            include /etc/nginx/sicp/headers.conf;
            proxy_pass http://query_instances;
        }
        location = /livez {
            include /etc/nginx/sicp/headers.conf;
            proxy_pass http://query_instances;
        }
        location = /readyz {
            include /etc/nginx/sicp/headers.conf;
            proxy_pass http://query_instances;
        }
        location = /api/v1/sicp { return 404; }
        location / { return 404; }
    }
